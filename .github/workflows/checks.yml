name: Cargo Build & Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: ubuntu-latest

  macos_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: macos-latest

  windows_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: windows-latest

  end_to_end:
    name: End-to-end tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            spago_cache: ~/.cache/spago-nodejs
          - os: macos-latest
            spago_cache: ~/Library/Caches/spago-nodejs
          - os: windows-latest
            spago_cache: ~/AppData/Local/spago-nodejs/Cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@22
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: v2-e2e-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests-e2e/tools/pnpm-lock.yaml') }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: "false"
          prefix-key: "v2-e2e-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-nextest,just

      - name: Cache Spago registry
        uses: actions/cache@v6
        with:
          path: ${{ matrix.spago_cache }}
          key: v2-spago-${{ runner.os }}-${{ hashFiles('tests-e2e/tools/pnpm-lock.yaml') }}

      - name: Prepare end-to-end tools
        run: just e2e-prepare

      - name: Run end-to-end tests
        run: just e2e --locked

  compatibility:
    name: Package compatibility
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Restore compatibility packages
        id: compatibility-package-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: >-
            v2-compatibility-packages-pr-${{ github.event.pull_request.number }}-${{ hashFiles('base/tests-compatibility/purescript-*.txt', 'candidate/tests-compatibility/purescript-*.txt') }}
          restore-keys: |
            v2-compatibility-packages-pr-${{ github.event.pull_request.number }}-

      - name: Build compatibility verifiers
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path base/Cargo.toml \
            --target-dir compatibility-target/base -p tests-compatibility
          cp compatibility-target/base/release/tests-compatibility compatibility-binaries/base
          cargo build --release --manifest-path candidate/Cargo.toml \
            --target-dir compatibility-target/candidate -p tests-compatibility
          cp compatibility-target/candidate/release/tests-compatibility compatibility-binaries/candidate

      - name: Prepare core and Acme corpus
        working-directory: candidate
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
        run: |
          ../compatibility-binaries/candidate prepare \
            --preset core \
            --preset acme \
            --cache-dir "$PACKAGE_CACHE_DIR"

      - name: Collect base and candidate reports
        id: reports
        env:
          CORPUS_DIR: ${{ github.workspace }}/candidate/target/compatibility
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
          REPORT_DIR: ${{ github.workspace }}/compatibility-artifacts
        run: |
          mkdir -p "$REPORT_DIR"

          # Status 1 is a valid verifier report containing diagnostics; status 2 is an execution failure.
          set +e
          (
            cd base
            ../compatibility-binaries/base verify \
              --preset core \
              --preset acme \
              --registry-dir "$CORPUS_DIR/registry" \
              --index-dir "$CORPUS_DIR/registry-index" \
              --cache-dir "$PACKAGE_CACHE_DIR" \
              --json-output "$REPORT_DIR/base.json"
          ) > "$REPORT_DIR/base.log" 2>&1
          base_status=$?

          (
            cd candidate
            ../compatibility-binaries/candidate verify \
              --preset core \
              --preset acme \
              --registry-dir "$CORPUS_DIR/registry" \
              --index-dir "$CORPUS_DIR/registry-index" \
              --cache-dir "$PACKAGE_CACHE_DIR" \
              --json-output "$REPORT_DIR/candidate.json"
          ) > "$REPORT_DIR/candidate.log" 2>&1
          candidate_status=$?
          set -e

          echo "base_status=$base_status" >> "$GITHUB_OUTPUT"
          echo "candidate_status=$candidate_status" >> "$GITHUB_OUTPUT"

      - name: Compare compatibility reports
        id: comparison
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_DIR: ${{ github.workspace }}/compatibility-artifacts
        run: |
          set +e
          compatibility-binaries/candidate compare \
            --base-report "$REPORT_DIR/base.json" \
            --candidate-report "$REPORT_DIR/candidate.json" \
            --json-output "$REPORT_DIR/comparison.json" \
            --summary-output "$REPORT_DIR/summary.md" \
            --github-annotations \
            2>&1 | tee "$REPORT_DIR/comparison.log"
          comparison_status=${PIPESTATUS[0]}
          set -e

          if [[ -f "$REPORT_DIR/summary.md" ]]; then
            cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "$PR_NUMBER" > "$REPORT_DIR/pull-request-number"

          echo "status=$comparison_status" >> "$GITHUB_OUTPUT"

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-reports
          path: compatibility-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Save compatibility packages
        if: >-
          always() &&
          steps.compatibility-package-cache.outputs.cache-hit != 'true' &&
          steps.compatibility-package-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: ${{ steps.compatibility-package-cache.outputs.cache-primary-key }}

      - name: Enforce compatibility result
        if: always()
        env:
          BASE_STATUS: ${{ steps.reports.outputs.base_status }}
          CANDIDATE_STATUS: ${{ steps.reports.outputs.candidate_status }}
          COMPARISON_STATUS: ${{ steps.comparison.outputs.status }}
        run: |
          # Preserve verifier status 1 for comparison, then fail only for execution failures or regressions.
          if [[ "$BASE_STATUS" != "0" && "$BASE_STATUS" != "1" ]]; then
            echo "::error::Base compatibility verifier failed with status ${BASE_STATUS:-missing}"
            exit 1
          fi
          if [[ "$CANDIDATE_STATUS" != "0" && "$CANDIDATE_STATUS" != "1" ]]; then
            echo "::error::Candidate compatibility verifier failed with status ${CANDIDATE_STATUS:-missing}"
            exit 1
          fi
          if [[ "$COMPARISON_STATUS" != "0" && "$COMPARISON_STATUS" != "1" ]]; then
            echo "::error::Compatibility report comparison failed with status ${COMPARISON_STATUS:-missing}"
            exit 1
          fi
          exit "$COMPARISON_STATUS"

  static_checks:
    name: Static checks (rustfmt, licenses, clippy, wasm)
    runs-on: ubuntu-latest
    env:
      IRIS_NIGHTLY_TOOLCHAIN: nightly-2026-09-09

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchains
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup toolchain install "$IRIS_NIGHTLY_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Install tools
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: just@1.58.0,cargo-bundle-licenses@4.2.0

      - name: Check formatting
        run: just format --check

      - name: Check generated licenses
        run: |
          just licenses
          git diff --exit-code -- THIRDPARTY.toml

      - name: Run Clippy
        run: cargo clippy --workspace --locked

      - name: Check WASM compilation
        run: cargo check -p iris-analysis --locked --target wasm32-unknown-unknown
