name: Cargo Build & Test

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: ubuntu-latest
      partitions: '["1/4","2/4","3/4","4/4"]'

  macos_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: macos-latest
      partitions: '["1/3","2/3","3/3"]'

  windows_tests:
    uses: ./.github/workflows/platform-tests.yml
    with:
      os: windows-latest
      partitions: '["1/5","2/5","3/5","4/5","5/5"]'

  end_to_end:
    name: End-to-end tests (${{ matrix.os }})
    permissions:
      attestations: read
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            spago_cache: ~/.cache/spago-nodejs
          - os: macos-latest
            spago_cache: ~/Library/Caches/spago-nodejs
          - os: windows-latest
            spago_cache: ~/AppData/Local/spago-nodejs/Cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@22
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: v2-e2e-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests-e2e/tools/pnpm-lock.yaml') }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v9-workspace"
          shared-key: "build-e2e"
          save-if: "false"

      - name: Install tools
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest,just

      - name: Cache Spago registry
        uses: actions/cache@v6
        with:
          path: ${{ matrix.spago_cache }}
          key: v2-spago-${{ runner.os }}-${{ hashFiles('tests-e2e/tools/pnpm-lock.yaml') }}

      - name: Prepare end-to-end tools
        run: just e2e-prepare

      - name: Run end-to-end tests
        env:
          # `iris self update` verifies release attestations with the GitHub CLI, which requires
          # signing in, and reads canaries through the rate-limited API.
          GH_TOKEN: ${{ github.token }}
        run: just e2e --locked

  compatibility:
    name: Package compatibility
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v1-compatibility"
          shared-key: "verifiers"
          workspaces: candidate -> ../compatibility-target/candidate
          save-if: "false"

      - name: Restore base compatibility verifier
        id: base-verifier-cache
        uses: actions/cache/restore@v6
        with:
          path: compatibility-binaries/base
          key: v1-compatibility-verifier-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha }}

      - name: Restore compatibility packages
        id: compatibility-package-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: >-
            v2-compatibility-packages-pr-${{ github.event.pull_request.number }}-${{ hashFiles('base/tests-compatibility/purescript-*.txt', 'candidate/tests-compatibility/purescript-*.txt') }}
          restore-keys: |
            v2-compatibility-packages-pr-${{ github.event.pull_request.number }}-

      - name: Build base compatibility verifier
        if: steps.base-verifier-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path base/Cargo.toml \
            --target-dir compatibility-target/base -p tests-compatibility
          cp compatibility-target/base/release/tests-compatibility compatibility-binaries/base

      - name: Build candidate compatibility verifier
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path candidate/Cargo.toml \
            --target-dir compatibility-target/candidate -p tests-compatibility
          cp compatibility-target/candidate/release/tests-compatibility compatibility-binaries/candidate

      - name: Prepare core and Acme corpus
        working-directory: candidate
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
        run: |
          ../compatibility-binaries/candidate prepare \
            --preset core \
            --preset acme \
            --cache-dir "$PACKAGE_CACHE_DIR"

      - name: Collect base and candidate reports
        id: reports
        env:
          CORPUS_DIR: ${{ github.workspace }}/candidate/target/compatibility
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
          REPORT_DIR: ${{ github.workspace }}/compatibility-artifacts
        run: |
          mkdir -p "$REPORT_DIR"

          # Status 1 is a valid verifier report containing diagnostics; status 2 is an execution failure.
          set +e
          (
            cd base
            ../compatibility-binaries/base verify \
              --preset core \
              --preset acme \
              --registry-dir "$CORPUS_DIR/registry" \
              --index-dir "$CORPUS_DIR/registry-index" \
              --cache-dir "$PACKAGE_CACHE_DIR" \
              --json-output "$REPORT_DIR/base.json"
          ) > "$REPORT_DIR/base.log" 2>&1
          base_status=$?

          (
            cd candidate
            ../compatibility-binaries/candidate verify \
              --preset core \
              --preset acme \
              --registry-dir "$CORPUS_DIR/registry" \
              --index-dir "$CORPUS_DIR/registry-index" \
              --cache-dir "$PACKAGE_CACHE_DIR" \
              --json-output "$REPORT_DIR/candidate.json"
          ) > "$REPORT_DIR/candidate.log" 2>&1
          candidate_status=$?
          set -e

          echo "base_status=$base_status" >> "$GITHUB_OUTPUT"
          echo "candidate_status=$candidate_status" >> "$GITHUB_OUTPUT"

      - name: Compare compatibility reports
        id: comparison
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_DIR: ${{ github.workspace }}/compatibility-artifacts
        run: |
          set +e
          compatibility-binaries/candidate compare \
            --base-report "$REPORT_DIR/base.json" \
            --candidate-report "$REPORT_DIR/candidate.json" \
            --json-output "$REPORT_DIR/comparison.json" \
            --summary-output "$REPORT_DIR/summary.md" \
            --github-annotations \
            2>&1 | tee "$REPORT_DIR/comparison.log"
          comparison_status=${PIPESTATUS[0]}
          set -e

          if [[ -f "$REPORT_DIR/summary.md" ]]; then
            cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "$PR_NUMBER" > "$REPORT_DIR/pull-request-number"

          echo "status=$comparison_status" >> "$GITHUB_OUTPUT"

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-reports
          path: compatibility-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Save compatibility packages
        if: >-
          always() &&
          steps.compatibility-package-cache.outputs.cache-hit != 'true' &&
          steps.compatibility-package-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: ${{ steps.compatibility-package-cache.outputs.cache-primary-key }}

      - name: Enforce compatibility result
        if: always()
        env:
          BASE_STATUS: ${{ steps.reports.outputs.base_status }}
          CANDIDATE_STATUS: ${{ steps.reports.outputs.candidate_status }}
          COMPARISON_STATUS: ${{ steps.comparison.outputs.status }}
        run: |
          # Preserve verifier status 1 for comparison, then fail only for execution failures or regressions.
          if [[ "$BASE_STATUS" != "0" && "$BASE_STATUS" != "1" ]]; then
            echo "::error::Base compatibility verifier failed with status ${BASE_STATUS:-missing}"
            exit 1
          fi
          if [[ "$CANDIDATE_STATUS" != "0" && "$CANDIDATE_STATUS" != "1" ]]; then
            echo "::error::Candidate compatibility verifier failed with status ${CANDIDATE_STATUS:-missing}"
            exit 1
          fi
          if [[ "$COMPARISON_STATUS" != "0" && "$COMPARISON_STATUS" != "1" ]]; then
            echo "::error::Compatibility report comparison failed with status ${COMPARISON_STATUS:-missing}"
            exit 1
          fi
          exit "$COMPARISON_STATUS"

  performance:
    name: Performance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Recompiling a crate with several codegen units repartitions the generic code it
      # instantiates and changes inlining in stages a change never runs.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve base revision
        id: base
        run: echo "sha=$(git -C candidate rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Checkout base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        run: |
          rustup update stable && rustup default stable
          echo "rustc=$(rustc -V | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind

      # Instruction counts depend on the compiler that built the harness, so the cached base
      # harness is keyed by the toolchain as well as the revision.
      - name: Restore base measurement harness
        id: base-harness-cache
        uses: actions/cache/restore@v6
        with:
          path: compatibility-binaries/base
          key: v3-performance-harness-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ steps.base.outputs.sha }}

      - name: Restore performance packages
        id: packages-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: >-
            v1-performance-packages-${{ hashFiles('candidate/tests-compatibility/purescript-core.txt', 'candidate/tests-compatibility/src/verifier/cli.rs') }}
          restore-keys: |
            v1-performance-packages-

      - name: Build base measurement harness
        if: steps.base-harness-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path base/Cargo.toml \
            --target-dir performance-target/base -p tests-compatibility
          cp performance-target/base/release/tests-compatibility compatibility-binaries/base

      - name: Build candidate measurement harness
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path candidate/Cargo.toml \
            --target-dir performance-target/candidate -p tests-compatibility
          cp performance-target/candidate/release/tests-compatibility compatibility-binaries/candidate

      - name: Prepare core corpus
        working-directory: candidate
        env:
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
        run: ../compatibility-binaries/candidate prepare --preset core --cache-dir "$PACKAGE_CACHE_DIR"

      - name: Save performance packages
        if: steps.packages-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            compatibility-cache/downloads
            compatibility-cache/sources
          key: >-
            v1-performance-packages-${{ hashFiles('candidate/tests-compatibility/purescript-core.txt', 'candidate/tests-compatibility/src/verifier/cli.rs') }}

      # Callgrind counts depend on the process's starting state, including the working directory
      # and the lengths of its arguments, so both sides run from one directory with paths of
      # equal length.
      - name: Measure base and candidate
        id: measurements
        env:
          CORPUS_DIR: ${{ github.workspace }}/candidate/target/compatibility
          PACKAGE_CACHE_DIR: ${{ github.workspace }}/compatibility-cache
          REPORT_DIR: ${{ github.workspace }}/performance-artifacts
        run: |
          mkdir -p "$REPORT_DIR" performance-harness/base performance-harness/head
          cp compatibility-binaries/base performance-harness/base/tests-compatibility
          cp compatibility-binaries/candidate performance-harness/head/tests-compatibility
          options=(
            --preset core
            --registry-dir "$CORPUS_DIR/registry"
            --index-dir "$CORPUS_DIR/registry-index"
            --cache-dir "$PACKAGE_CACHE_DIR"
          )

          performance-harness/head/tests-compatibility measure "${options[@]}" \
            --json-output "$REPORT_DIR/core-head.json" > "$REPORT_DIR/head.log" 2>&1 || {
            echo "::error::Candidate measurement failed; see head.log in the performance-reports artifact"
            exit 1
          }

          if performance-harness/base/tests-compatibility measure --help > /dev/null 2>&1; then
            performance-harness/base/tests-compatibility measure "${options[@]}" \
              --json-output "$REPORT_DIR/core-base.json" > "$REPORT_DIR/base.log" 2>&1 || {
              echo "::error::Base measurement failed; see base.log in the performance-reports artifact"
              exit 1
            }
            echo "base_measurements=--base $REPORT_DIR/core-base.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base revision predates the measurement harness; reporting the candidate only"
          fi

      - name: Keep candidate as the next base harness
        run: cp compatibility-binaries/candidate compatibility-binaries/base

      - name: Save next base harness
        uses: actions/cache/save@v6
        with:
          path: compatibility-binaries/base
          key: v3-performance-harness-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ github.sha }}

      - name: Compare measurements
        id: comparison
        env:
          BASE_MEASUREMENTS: ${{ steps.measurements.outputs.base_measurements }}
          BASE_LABEL: ${{ steps.base.outputs.sha }}
          CANDIDATE_LABEL: ${{ github.sha }}
          REPORT_DIR: ${{ github.workspace }}/performance-artifacts
        run: |
          set +e
          # BASE_MEASUREMENTS is intentionally split into the option and its path.
          # shellcheck disable=SC2086
          compatibility-binaries/candidate compare-performance \
            $BASE_MEASUREMENTS \
            --candidate "$REPORT_DIR/core-head.json" \
            --base-label "$BASE_LABEL" \
            --candidate-label "$CANDIDATE_LABEL" \
            --json-output "$REPORT_DIR/comparison.json" \
            --summary-output "$REPORT_DIR/summary.md" \
            2>&1 | tee "$REPORT_DIR/comparison.log"
          comparison_status=${PIPESTATUS[0]}
          set -e

          if [[ -f "$REPORT_DIR/summary.md" ]]; then
            cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "status=$comparison_status" >> "$GITHUB_OUTPUT"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: performance-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce performance result
        env:
          COMPARISON_STATUS: ${{ steps.comparison.outputs.status }}
        run: |
          if [[ "$COMPARISON_STATUS" != "0" && "$COMPARISON_STATUS" != "1" ]]; then
            echo "::error::Performance comparison failed with status ${COMPARISON_STATUS:-missing}"
            exit 1
          fi
          if [[ "$COMPARISON_STATUS" == "1" ]]; then
            echo "::error::A gated performance metric regressed; see the job summary"
          fi
          exit "$COMPARISON_STATUS"

  compatibility_cache:
    name: Package compatibility verifier cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v1-compatibility"
          shared-key: "verifiers"
          workspaces: candidate -> ../compatibility-target/candidate

      - name: Build compatibility verifier
        run: |
          mkdir -p compatibility-binaries
          cargo build --release --manifest-path candidate/Cargo.toml \
            --target-dir compatibility-target/candidate -p tests-compatibility
          cp compatibility-target/candidate/release/tests-compatibility compatibility-binaries/base

      - name: Save compatibility verifier
        uses: actions/cache/save@v6
        with:
          path: compatibility-binaries/base
          key: v1-compatibility-verifier-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  static_checks:
    name: Static checks (rustfmt, licenses, clippy, wasm)
    runs-on: ubuntu-latest
    env:
      IRIS_NIGHTLY_TOOLCHAIN: nightly-2026-11-16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchains
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup toolchain install "$IRIS_NIGHTLY_TOOLCHAIN" --profile minimal --component rustfmt
          echo "IRIS_NIGHTLY_RUSTFMT=$(rustup which --toolchain "$IRIS_NIGHTLY_TOOLCHAIN" rustfmt)" >> "$GITHUB_ENV"

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v1-static-checks"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: just@1.59.0,cargo-bundle-licenses@5.0.0

      - name: Check formatting
        run: just format --check

      - name: Check generated licenses
        run: |
          just licenses
          git diff --exit-code -- THIRDPARTY.toml

      - name: Run Clippy
        run: cargo clippy --workspace --locked

      - name: Check WASM compilation
        run: cargo check -p iris-analysis --locked --target wasm32-unknown-unknown
