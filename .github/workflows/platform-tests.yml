name: Platform Tests

on:
  workflow_call:
    inputs:
      os:
        description: Runner image for the build and test jobs
        required: true
        type: string
      partitions:
        description: JSON array of nextest hash partitions, one test job each
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compilation
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v9-workspace"
          shared-key: "build-e2e"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest

      - name: Build workspace
        run: cargo build --workspace --locked --verbose

      - name: Archive test binaries
        run: >-
          cargo nextest archive --workspace
          --exclude tests-e2e --exclude tests-compatibility
          --locked --archive-file nextest-${{ runner.os }}.tar.zst

      - name: Upload test binaries
        uses: actions/upload-artifact@v7
        with:
          path: nextest-${{ runner.os }}.tar.zst
          archive: false
          if-no-files-found: error

      # The build artifact cache restores all of target/, which can include an incomplete copy of
      # the integration packages. The packages cache below owns that directory, so start it empty.
      - name: Clear restored integration packages
        shell: bash
        run: rm -rf target/integration-packages

      - name: Cache integration packages
        uses: actions/cache@v6
        with:
          path: target/integration-packages
          key: integration-packages-v3-${{ runner.os }}-${{ hashFiles('tests-integration/packages.json', 'tests-support/src/**') }}

      - name: Prepare integration packages
        run: cargo run -p tests-support --locked -- prepare tests-integration/packages.json target/integration-packages

      - name: Upload integration packages
        uses: actions/upload-artifact@v7
        with:
          name: integration-packages-${{ runner.os }}
          path: target/integration-packages
          include-hidden-files: true
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.partition }})
    needs: build
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: nextest-${{ runner.os }}.tar.zst

      - name: Install Node.js for backend verification
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download integration packages
        uses: actions/download-artifact@v8
        with:
          name: integration-packages-${{ runner.os }}
          path: target/integration-packages

      - name: Run tests
        shell: bash
        env:
          PARTITION: ${{ matrix.partition }}
        run: >-
          cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst
          --partition "hash:$PARTITION"
