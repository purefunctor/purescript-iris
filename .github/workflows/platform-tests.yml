name: Platform Tests

on:
  workflow_call:
    inputs:
      os:
        description: Runner image for the build and test jobs
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compilation
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: "false"
          prefix-key: "v9-workspace"
          shared-key: "build-e2e"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-nextest

      - name: Build workspace
        run: cargo build --workspace --locked --verbose

      - name: Archive test binaries
        run: >-
          cargo nextest archive --workspace
          --exclude tests-e2e --exclude tests-compatibility --exclude compiler-scripts
          --locked --archive-file nextest-${{ runner.os }}.tar.zst

      - name: Upload test binaries
        uses: actions/upload-artifact@v7
        with:
          path: nextest-${{ runner.os }}.tar.zst
          archive: false
          if-no-files-found: error

      - name: Cache integration packages
        uses: actions/cache@v6
        with:
          path: target/integration-packages
          key: integration-packages-v3-${{ runner.os }}-${{ hashFiles('tests-integration/packages.json', 'tests-support/src/**') }}

      - name: Prepare integration packages
        run: cargo run -p tests-support --locked -- prepare tests-integration/packages.json target/integration-packages

      - name: Upload integration packages
        uses: actions/upload-artifact@v7
        with:
          name: integration-packages-${{ runner.os }}
          path: target/integration-packages
          include-hidden-files: true
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.category }}${{ matrix.partition && format(', {0}', matrix.partition) || '' }})
    needs: build
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        category: [workspace, support, lowering, resolving, lsp, docs, integration-other]
        include:
          - category: compiler
            partition: hash:1/4
          - category: compiler
            partition: hash:2/4
          - category: compiler
            partition: hash:3/4
          - category: compiler
            partition: hash:4/4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: nextest-${{ runner.os }}.tar.zst

      - name: Install Node.js for backend verification
        if: matrix.category == 'compiler'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download integration packages
        if: matrix.category == 'compiler'
        uses: actions/download-artifact@v8
        with:
          name: integration-packages-${{ runner.os }}
          path: target/integration-packages

      - name: Run tests
        shell: bash
        env:
          CATEGORY: ${{ matrix.category }}
          PARTITION: ${{ matrix.partition }}
        run: |
          case "$CATEGORY" in
            workspace)
              cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst \
                -E 'not package(tests-integration) and not package(tests-support)'
              ;;
            support)
              cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst -E 'package(tests-support)'
              ;;
            compiler)
              cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst \
                -E 'package(tests-integration) and binary(compiler)' --partition "$PARTITION"
              ;;
            integration-other)
              cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst \
                -E 'package(tests-integration) and not (binary(compiler) or binary(lowering) or binary(resolving) or binary(lsp) or binary(docs))'
              ;;
            *)
              cargo nextest run --archive-file nextest-${{ runner.os }}.tar.zst \
                -E "package(tests-integration) and binary($CATEGORY)"
              ;;
          esac
