name: Installer Tests

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to install
        required: true
        type: string
      revision:
        description: Repository revision containing the installer
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, or latest
        default: latest
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Any published release other than the installed one shows that the installed release can
      # replace itself with a release archive; this one predates `iris self update`.
      IRIS_UPDATE_VERSION: v0.1.5
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}

      - name: Require GitHub attestation verification
        shell: bash
        run: gh attestation verify --help >/dev/null

      - name: Install on Linux or macOS
        if: runner.os != 'Windows'
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}/iris/bin
          IRIS_VERSION: ${{ inputs.version }}
        run: |
          sh ./install.sh
          installed_version=$("$IRIS_INSTALL_DIR/iris" --version)
          printf 'Installed %s\n' "$installed_version"
          if [ "$IRIS_VERSION" != latest ] && [ "$installed_version" != "iris ${IRIS_VERSION#v}" ]; then
            printf 'Expected iris %s, found %s\n' "${IRIS_VERSION#v}" "$installed_version" >&2
            exit 1
          fi
          test ! -e "$IRIS_INSTALL_DIR/purescript-analyzer"
          test ! -e "$IRIS_INSTALL_DIR/purescript-iris"

      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}\iris\bin
          IRIS_VERSION: ${{ inputs.version }}
        run: |
          & ./install.ps1
          $InstalledVersion = & "$env:IRIS_INSTALL_DIR\iris.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "iris --version failed" }
          Write-Host "Installed $InstalledVersion"
          if ($env:IRIS_VERSION -ne "latest") {
            $ExpectedVersion = "iris " + $env:IRIS_VERSION.Substring(1)
            if ($InstalledVersion -ne $ExpectedVersion) {
              throw "Expected $ExpectedVersion, found $InstalledVersion"
            }
          }
          foreach ($LegacyBinary in @("purescript-analyzer.exe", "purescript-iris.exe")) {
            if (Test-Path "$env:IRIS_INSTALL_DIR\$LegacyBinary") {
              throw "Installer created legacy executable $LegacyBinary"
            }
          }

      - name: Update the installed release on Linux or macOS
        if: runner.os != 'Windows'
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}/iris/bin
        run: |
          iris="$IRIS_INSTALL_DIR/iris"
          if ! "$iris" self update --help >/dev/null 2>&1; then
            printf 'Skipping update: %s predates iris self update\n' "$("$iris" --version)"
            exit 0
          fi
          "$iris" self update "$IRIS_UPDATE_VERSION"
          updated_version=$("$iris" --version)
          if [ "$updated_version" != "iris ${IRIS_UPDATE_VERSION#v}" ]; then
            printf 'Expected iris %s, found %s\n' "${IRIS_UPDATE_VERSION#v}" "$updated_version" >&2
            exit 1
          fi

      - name: Update the installed release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}\iris\bin
        run: |
          $Iris = "$env:IRIS_INSTALL_DIR\iris.exe"
          & $Iris self update --help *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Skipping update: $(& $Iris --version) predates iris self update"
            exit 0
          }
          & $Iris self update $env:IRIS_UPDATE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "iris self update failed" }
          $UpdatedVersion = & $Iris --version
          $ExpectedVersion = "iris " + $env:IRIS_UPDATE_VERSION.Substring(1)
          if ($UpdatedVersion -ne $ExpectedVersion) {
            throw "Expected $ExpectedVersion, found $UpdatedVersion"
          }
