id: no-vec-new
valid:
  - |
    fn valid_vec_macro() -> Vec<u8> {
        vec![]
    }
  - |
    fn valid_vec_macro_values() -> Vec<u8> {
        vec![1, 2, 3]
    }
  - |
    fn valid_with_capacity() -> Vec<u8> {
        Vec::with_capacity(8)
    }
invalid:
  - |
    fn invalid_vec_new() -> Vec<u8> {
        Vec::new()
    }
  - |
    fn invalid_vec_new_turbofish() -> Vec<u8> {
        Vec::<u8>::new()
    }
  - |
    fn invalid_vec_new_qualified() -> Vec<u8> {
        std::vec::Vec::new()
    }
  - |
    fn invalid_vec_new_in_macro(count: usize) -> Vec<Vec<u8>> {
        vec![Vec::new(); count]
    }
