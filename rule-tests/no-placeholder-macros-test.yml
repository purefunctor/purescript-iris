id: no-placeholder-macros
valid:
  - |
    fn valid_unreachable(id: u32) -> u32 {
        if id < 1024 {
            id
        } else {
            unreachable!("invariant violated: {id} is not a valid index")
        }
    }
  - |
    fn valid_panic(command: Option<String>) -> String {
        match command {
            Some(command) => command,
            None => panic!("invariant violated: expected build command"),
        }
    }
  - |
    fn valid_mention_in_string() {
        println!("use todo!() instead");
    }
invalid:
  - |
    fn invalid_todo() -> u32 {
        todo!()
    }
  - |
    fn invalid_todo_message() -> u32 {
        todo!("handle overflow")
    }
  - |
    fn invalid_unimplemented() -> String {
        unimplemented!("InsertAndReplace")
    }
  - |
    fn invalid_dbg(value: u32) -> u32 {
        dbg!(value)
    }
  - |
    fn invalid_todo_brackets() -> u32 {
        todo!["handle overflow"]
    }
  - |
    fn invalid_unimplemented_braces() -> String {
        unimplemented! {"InsertAndReplace"}
    }
  - |
    fn invalid_qualified_dbg(value: u32) -> u32 {
        std::dbg!(value)
    }
  - |
    fn invalid_nested_in_macro() {
        let _ = wrapper!(todo!(), "todo!() mention");
    }
  - |
    fn invalid_nested_in_definition() {
        macro_rules! defer_todo {
            () => { todo!("later") };
        }
        let _ = defer_todo;
    }
