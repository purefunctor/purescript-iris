id: no-core-protocol-dependency
valid:
  - |
    use std::collections::HashMap;
  - |
    use checking::CheckedModule;
invalid:
  - |
    use lsp_types::CompletionItem;
  - |
    use lsp_types::*;
  - |
    use async_lsp::ClientSocket;
  - |
    fn invalid_qualified_protocol_path(position: lsp_types::Position) -> lsp_types::Position {
        position
    }
  - |
    fn invalid_qualified_protocol_call(client: &()) {
        let _ = async_lsp::ClientSocket::clone(client);
    }
