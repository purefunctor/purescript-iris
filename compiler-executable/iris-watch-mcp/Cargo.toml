[package]
name = "iris-watch-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "An MCP server that answers tool calls through a running `iris watch`."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
iris-watch-query = { version = "0.1.0", path = "../iris-watch-query" }
iris-watch-server = { version = "0.1.0", path = "../iris-watch-server" }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"] }
