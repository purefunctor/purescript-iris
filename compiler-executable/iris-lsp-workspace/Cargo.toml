[package]
name = "iris-lsp-workspace"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "Workspace state, analysis, and diagnostics for the Iris language server."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
building = { version = "0.1.0", path = "../../compiler-core/building" }
files = { version = "0.1.0", path = "../../compiler-core/files" }
iris-analysis = { version = "0.1.0", path = "../../compiler-services/iris-analysis" }
iris-build = { version = "0.1.0", path = "../iris-build" }
iris-lsp-server = { version = "0.1.0", path = "../iris-lsp-server" }
lsp-types.workspace = true
parking_lot = "0.12.5"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
