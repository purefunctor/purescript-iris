[package]
name = "iris-self-update"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "Replaces the running Iris with a published release."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
dunce = "1.0.5"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[target.'cfg(windows)'.dependencies]
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
