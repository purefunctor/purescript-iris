[package]
name = "configuration"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
jsonschema = { version = "0.55.1", default-features = false }
serde_json = "1.0.151"

[[example]]
name = "export-schema"
required-features = ["schema"]
