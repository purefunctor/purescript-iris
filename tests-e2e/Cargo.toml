[package]
name = "tests-e2e"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
autotests = false

[dependencies]
iris-cli = { path = "../compiler-executable/iris-cli" }

[dev-dependencies]
dunce = "1.0.5"
insta = { version = "1.48.0", features = ["filters"] }
itertools = "0.15.0"
lsp-server = "0.10.0"
lsp-types.workspace = true
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
url = "2.5.8"

[[bin]]
name = "iris-e2e"
path = "src/bin/iris-e2e.rs"

[[bin]]
name = "spago-e2e"
path = "src/bin/spago-e2e.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "lsp"
path = "tests/lsp.rs"

[[test]]
name = "package_manager"
path = "tests/package_manager.rs"

[[test]]
name = "stylex"
path = "tests/stylex.rs"
