[package]
name = "tests-e2e"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
purescript-iris = { path = "../compiler-bin" }
purescript-iris-v2 = { path = "../compiler-bin-v2/iris" }

[dev-dependencies]
async-lsp = { version = "0.2.4", features = ["tokio"] }
insta = { version = "1.48.0", features = ["filters"] }
itertools = "0.15.0"
lsp-types.workspace = true
regex = "1.12.2"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
url = "2.5.8"

[[bin]]
name = "iris-e2e"
path = "src/bin/iris-e2e.rs"

[[bin]]
name = "iris-v2-e2e"
path = "src/bin/iris-v2-e2e.rs"

[[bin]]
name = "spago-e2e"
path = "src/bin/spago-e2e.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "lsp"
path = "tests/lsp.rs"

[[test]]
name = "package_manager"
path = "tests/package_manager.rs"

[[test]]
name = "stylex"
path = "tests/stylex.rs"
