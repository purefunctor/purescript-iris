[package]
name = "compiler-scripts"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
console = "0.16"
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", features = ["inline"] }
tests-support = { path = "../tests-support" }
