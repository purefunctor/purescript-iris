agents:
  queue: linux-large

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"

steps:
  - label: ":test_tube: Build and tests (Linux)"
    key: build-linux
    commands: &build-commands
      - source .buildkite/setup.sh
      - cargo build --workspace --locked
      - cargo nextest run --locked --no-fail-fast
      - cargo nextest run -p tests-support --locked --no-fail-fast
      - bash .buildkite/test.sh integration
      - bash .buildkite/test.sh e2e
    cache:
      name: linux-x64-build-v1
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        # Do not persist Cargo credentials or configuration alongside dependency caches.
        - "~/.cargo/bin"
        - "~/.cargo/registry"
        - "~/.cargo/git"
        - "~/.rustup"
        - target
        - "~/.cache/spago-nodejs"
    timeout_in_minutes: 30

  - label: ":test_tube: Build and tests (macOS)"
    key: build-macos
    agents:
      queue: macos-26-medium
    commands: *build-commands
    cache:
      name: macos26-arm64-build-v1
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.cargo/bin"
        - "~/.cargo/registry"
        - "~/.cargo/git"
        - "~/.rustup"
        - target
        - "~/Library/Caches/spago-nodejs"
    timeout_in_minutes: 30

  - label: ":rust: Static checks (rustfmt, licenses, clippy, wasm)"
    key: static-checks
    commands:
      - source .buildkite/setup.sh
      - just format --check
      - just licenses
      - git diff --exit-code -- THIRDPARTY.toml
      - cargo clippy --workspace --locked
      - cargo check -p iris-analysis --locked --target wasm32-unknown-unknown
    cache:
      name: linux-x64-formatting-v1
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.cargo/bin"
        - "~/.cargo/registry"
        - "~/.cargo/git"
        - "~/.rustup"
        - target
    timeout_in_minutes: 30
