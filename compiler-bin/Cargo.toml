[package]
name = "purescript-iris"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license = "BSD-3-Clause"
description = "Language implementation for the PureScript programming language."
readme = "../README.md"
homepage = "https://github.com/purefunctor/purescript-iris"
repository = "https://github.com/purefunctor/purescript-iris"
keywords = ["purescript", "language server"]
categories = ["compilers"]

[features]
default = []
no-tracing = ["tracing/max_level_off"]

[[bin]]
name = "iris"
path = "src/bin/iris.rs"

[dependencies]
analyzer = { version = "0.1.0", path = "../compiler-lsp/analyzer" }
async-lsp = { version = "0.2.4", features = ["tokio"] }
building = { version = "0.1.0", path = "../compiler-core/building" }
checking = { version = "0.1.0", path = "../compiler-frontend/checking" }
configuration = { version = "0.1.0", path = "../compiler-lsp/configuration" }
console = "0.16.4"
documentation = { version = "0.1.0", path = "../compiler-lsp/documentation" }
diagnostics = { version = "0.1.0", path = "../compiler-frontend/diagnostics" }
dunce = "1.0.5"
files = { version = "0.1.0", path = "../compiler-core/files" }
globset = "0.4.20"
ignore = "0.4.33"
indicatif = "0.18.6"
indexing = { version = "0.1.0", path = "../compiler-frontend/indexing" }
itertools = "0.15.0"
javascript = { version = "0.1.0", path = "../compiler-backend/javascript" }
jiff = "0.2.35"
line-index = "0.1.2"
lowering = { version = "0.1.0", path = "../compiler-frontend/lowering" }
lsp-types.workspace = true
notify = "8.2.0"
parking_lot = "0.12.5"
path-absolutize = "4.0.1"
petgraph = "0.8.3"
prim-constants = { version = "0.1.0", path = "../compiler-core/prim-constants" }
radix_trie = "0.3.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
resolving = { version = "0.1.0", path = "../compiler-frontend/resolving" }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.12"
smol_str = "0.3.6"
spago = { version = "0.1.0", path = "../compiler-lsp/spago" }
stabilizing = { version = "0.1.0", path = "../compiler-frontend/stabilizing" }
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
url = "2.5.8"
usage = { package = "usage-rs", version = "6.8.0" }
walkdir = "2.5.0"

[dev-dependencies]
insta = "1.48.0"

[target.'cfg(not(unix))'.dependencies]
tokio-util = { version = "0.7.19", features = ["compat"] }
