[package]
name = "iris-build"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "PureScript package build planning and execution for Iris."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
building = { version = "0.1.0", path = "../../compiler-core/building" }
iris-progress = { version = "0.1.0", path = "../iris-progress" }
iris-spago = { version = "0.1.0", path = "../iris-spago" }
diagnostics = { version = "0.1.0", path = "../../compiler-frontend/diagnostics" }
dunce = "1.0.5"
files = { version = "0.1.0", path = "../../compiler-core/files" }
globset = "0.4.20"
ignore = "0.4.33"
itertools = "0.15.0"
javascript = { version = "0.1.0", path = "../../compiler-backend/javascript" }
line-index = "0.1.2"
path-absolutize = "4.0.1"
petgraph = "0.8.3"
prim-constants = { version = "0.1.0", path = "../../compiler-core/prim-constants" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_yml = "0.0.12"
smol_str = "0.3.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
# Match the Unicode 13 tables used by Spago 1.0.4.
unicode-case-mapping = "=0.2.0"
unicode-general-category = "=0.4.0"
url = "2.5.8"
walkdir = "2.5.0"
