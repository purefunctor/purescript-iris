[package]
name = "iris-spago"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "Spago manifest parsing, package metadata, and command invocation for Iris."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol_str = { version = "0.3.6", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
yaml_serde = "0.10.7"

[dev-dependencies]
insta = "1.48.0"
