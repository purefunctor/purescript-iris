[package]
name = "iris-package"
version = "0.1.0"
edition = "2024"
authors = ["Justin Garcia <git@purefunctor.me>"]
license.workspace = true
description = "PureScript package management commands for Iris."
repository = "https://github.com/purefunctor/purescript-iris"

[dependencies]
ignore = "0.4.33"
iris-spago = { version = "0.1.0", path = "../iris-spago" }
itertools = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.12"
thiserror = "2.0.20"
