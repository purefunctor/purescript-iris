id: no-core-protocol-dependency
language: rust
severity: error
message: "compiler-core must stay independent of user-facing protocol concerns (compiler-core/AGENTS.md)."
note: "Pipeline orchestration in `building` may depend outward on stage crates, but protocol types such as `lsp_types` must not leak into core."
rule:
  any:
    - kind: use_declaration
      regex: '\b(lsp_types|async_lsp)\b'
    - kind: scoped_identifier
      regex: '\b(lsp_types|async_lsp)::'
      all:
        - not:
            inside:
              kind: use_declaration
              stopBy: end
        # Report the outermost path only, at any nesting depth.
        - not:
            inside:
              kind: scoped_identifier
              stopBy: end
    # Type positions use a distinct node kind from expression paths.
    # The nesting exclusion spans any depth, so `lsp_types::A::B`
    # reports once for the outermost path.
    - kind: scoped_type_identifier
      regex: '\b(lsp_types|async_lsp)::'
      all:
        - not:
            inside:
              kind: use_declaration
              stopBy: end
        - not:
            inside:
              kind: scoped_type_identifier
              stopBy: end
    # Macro bodies are opaque token trees, so use the identifier
    # discipline: the path root survives as a parsed identifier child,
    # while string mentions leave none behind. Scoped to `token_tree`
    # so the outer macro's own name cannot match.
    - kind: macro_invocation
      has:
        stopBy: end
        kind: identifier
        regex: '^(lsp_types|async_lsp)$'
        inside:
          kind: token_tree
          stopBy: end
    - kind: macro_definition
      has:
        stopBy: end
        kind: identifier
        regex: '^(lsp_types|async_lsp)$'
        inside:
          kind: token_tree
          stopBy: end
files:
  - 'compiler-core/**'
