id: no-vec-new
language: rust
severity: error
message: "Use `vec![]` instead of `Vec::new()`; use `Vec::with_capacity(n)` when capacity is known."
rule:
  any:
    - pattern: 'Vec::new()'
    - pattern: 'Vec::<$$$>::new()'
    - pattern: 'std::vec::Vec::new()'
    - pattern: 'std::vec::Vec::<$$$>::new()'
    # Inside macro bodies the token tree is opaque to patterns, so match
    # macro text instead. The leading boundary excludes `SmallVec::new`;
    # the trailing `(` excludes `Vec::with_capacity`. String literals are
    # excluded because the ban is about constructor calls, not mentions.
    - kind: macro_invocation
      all:
        - regex: '(^|[^_a-zA-Z0-9])Vec::(new\s*\(|<[^;{}]*>::new\s*\()'
        - not:
            has:
              stopBy: end
              kind: string_literal
              regex: 'Vec::'
