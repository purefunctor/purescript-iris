id: no-vec-new
language: rust
severity: error
message: "Use `vec![]` instead of `Vec::new()`; use `Vec::with_capacity(n)` when capacity is known."
rule:
  any:
    - pattern: 'Vec::new()'
    - pattern: 'Vec::<$$$>::new()'
    - pattern: 'std::vec::Vec::new()'
    - pattern: 'std::vec::Vec::<$$$>::new()'
    # Nested inside another macro's opaque token tree: `Vec` survives as a
    # parsed identifier child, while string mentions leave none behind.
    # `with_capacity` shares the identifier but stays allowed. Scoped to
    # `token_tree` so the outer macro's own name cannot match.
    - kind: macro_invocation
      all:
        - has:
            stopBy: end
            kind: identifier
            regex: '^Vec$'
            inside:
              kind: token_tree
              stopBy: end
        - not:
            has:
              stopBy: end
              kind: identifier
              regex: '^with_capacity$'
    # `macro_rules!` bodies are opaque token trees with no call to match;
    # the identifier discipline applies unchanged.
    - kind: macro_definition
      all:
        - has:
            stopBy: end
            kind: identifier
            regex: '^Vec$'
            inside:
              kind: token_tree
              stopBy: end
        - not:
            has:
              stopBy: end
              kind: identifier
              regex: '^with_capacity$'
