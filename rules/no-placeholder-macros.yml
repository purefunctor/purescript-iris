id: no-placeholder-macros
language: rust
severity: error
message: "Remove `todo!`, `unimplemented!`, and `dbg!` before merging; the codebase carries none (AGENTS.md: avoid temporary fixes)."
rule:
  any:
    # Direct invocations in every delimiter (`()`, `[]`, `{}`), bare and
    # qualified (`std::`, `core::`). Structural patterns ignore string
    # contents, so mentions in message arguments never match.
    - pattern: 'todo!($$$)'
    - pattern: 'todo![$$$]'
    - pattern: 'todo!{$$$}'
    - pattern: 'unimplemented!($$$)'
    - pattern: 'unimplemented![$$$]'
    - pattern: 'unimplemented!{$$$}'
    - pattern: 'dbg!($$$)'
    - pattern: 'dbg![$$$]'
    - pattern: 'dbg!{$$$}'
    - pattern: '$PATH::todo!($$$)'
    - pattern: '$PATH::unimplemented!($$$)'
    - pattern: '$PATH::dbg!($$$)'
    # Nested inside another macro's opaque token tree: the banned name
    # survives as a parsed identifier child, while pure string mentions
    # leave no identifier behind. Scoped to `token_tree` so the outer
    # macro's own name cannot match.
    - kind: macro_invocation
      has:
        stopBy: end
        kind: identifier
        regex: '^(todo|unimplemented|dbg)$'
        inside:
          kind: token_tree
          stopBy: end
    # `macro_rules!` bodies are opaque token trees with no invocation to
    # match; the identifier discipline applies unchanged.
    - kind: macro_definition
      has:
        stopBy: end
        kind: identifier
        regex: '^(todo|unimplemented|dbg)$'
        inside:
          kind: token_tree
          stopBy: end
