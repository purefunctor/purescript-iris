[workspace]
members = [
  "compiler-bin/*",
  "compiler-backend/*",
  "compiler-core/*",
  "compiler-frontend/*",
  "compiler-lsp/*",
  "compiler-scripts",
  "tests-compatibility",
  "tests-e2e",
  "tests-integration",
  "tests-support",
]
default-members = [
  "compiler-backend/*",
  "compiler-core/*",
  "compiler-frontend/*",
  "compiler-lsp/*",
]
resolver = "3"

[workspace.dependencies]
lsp-types = "=0.95.1"

[profile.dev.package.insta]
opt-level = 3
