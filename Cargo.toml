[workspace]
members = [
  "compiler-executable/*",
  "compiler-backend/*",
  "compiler-core/*",
  "compiler-frontend/*",
  "compiler-services/*",
  "compiler-scripts",
  "tests-compatibility",
  "tests-e2e",
  "tests-integration",
  "tests-support",
]
default-members = [
  "compiler-executable/*",
  "compiler-backend/*",
  "compiler-core/*",
  "compiler-frontend/*",
  "compiler-services/*",
]
resolver = "3"

[workspace.package]
license = "BSD-3-Clause"

[workspace.dependencies]
lsp-types = { package = "gen-lsp-types", version = "=0.11.0", features = ["url"] }

[profile.dev.package.insta]
opt-level = 3
